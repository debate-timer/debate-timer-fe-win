name: build-windows

# Windows 인스톨러(NSIS)를 windows-latest 러너에서 네이티브로 빌드한다.
# - wine 불필요(네이티브 Windows 빌드)
# - 산출물은 Actions 아티팩트로 업로드되어 Windows 머신에서 바로 다운로드 가능
on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/#24-time-out-option'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (ia32 + x64)
        run: npm run electron:build -- --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: debate-timer-windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error
