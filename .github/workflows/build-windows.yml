name: build-windows

# Windows 인스톨러(NSIS)를 windows-latest 러너에서 네이티브로 빌드한다.
# - wine 불필요(네이티브 Windows 빌드)
# - 산출물은 Actions 아티팩트로 업로드되어 Windows 머신에서 바로 다운로드 가능
on:
  workflow_dispatch:

jobs:
  build-electron:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # vite build는 타입 에러가 있어도 걸러주지 못하므로,
      # 빌드 전에 tsc 타입 체크를 수행해 안전한 산출물을 보장한다.
      - name: Typecheck
        run: npm run lint:tsc

      # electron:build 스크립트는 `vite build --config vite.config.electron.mts && electron-builder` 형태라
      # `npm run electron:build -- --win`으로는 플래그가 electron-builder에 제대로 전달되지 않는다.
      # (compound 스크립트 + npm `--` 전달 이슈) → 두 단계로 분리해 직접 호출한다.
      - name: Build web assets (vite)
        run: npx vite build --config vite.config.electron.mts

      - name: Package Windows installer (ia32 + x64)
        run: npx electron-builder --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: debate-timer-windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error

  build-tauri:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            artifact: debate-timer-tauri-windows-x64
          - architecture: ia32
            target: i686-pc-windows-msvc
            artifact: debate-timer-tauri-windows-ia32

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Set up latest stable Rust (${{ matrix.architecture }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Show Rust tool versions
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck React
        run: npm run lint:tsc

      - name: Typecheck Tauri configuration
        run: npm run lint:tauri:tsc

      - name: Test Tauri Rust backend
        if: matrix.architecture == 'x64'
        run: npm run test:tauri:rust

      - name: Build Tauri NSIS installer (${{ matrix.architecture }})
        run: npx tauri build --target ${{ matrix.target }}

      - name: Upload Tauri installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
